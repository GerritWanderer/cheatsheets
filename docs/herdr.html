<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Herdr Cheatsheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="assets/sheet.css">
</head>
<body>
<script>
// Source: ~/.config/herdr/config.toml (mirrors the Omarchy tmux config) + herdr 0.9.5 defaults.
window.SHEET = {
  eyebrow: "Terminal workspaces · herdr 0.9.5",
  title: "Herdr",
  sub: "Keys from the Omarchy-style config: workspace ≈ tmux session, tab ≈ tmux window, pane ≈ tmux pane.",
  prefix: "Ctrl+Space",
  sections: [
    { title: "Panes", tag: "split", items: [
      ["split right", "Prefix |"],
      ["split down", "Prefix -"],
      ["close pane", "Prefix x"],
      ["toggle zoom", "Prefix z"],
      ["focus pane, also across nvim splits", "Ctrl+h/j/k/l"],
      ["resize pane", "Ctrl+Shift+H/J/K/L"],
      ["cycle to next pane", "Prefix Tab"],
      ["cycle to previous pane", "Prefix Shift+Tab"],
      ["rename pane", "Prefix Shift+O"],
      ["edit scrollback in editor", "Prefix e"],
    ]},
    { title: "Tabs", tag: "tmux window", items: [
      ["new tab", "Prefix c"],
      ["rename tab", "Prefix r"],
      ["close tab", "Prefix k"],
      ["go to tab 1–9", "Prefix 1…9"],
      ["go to tab 1–9", "Alt+1…9"],
      ["next tab", "Prefix n"],
      ["previous tab", "Prefix p"],
      ["move tab left / right", "Alt+Shift+H/L"],
    ]},
    { title: "Workspaces", tag: "tmux session", items: [
      ["new workspace", "Prefix Shift+C"],
      ["rename workspace", "Prefix Shift+R"],
      ["close workspace", "Prefix Shift+K"],
      ["previous / next workspace", "Alt+Up Alt+Down", "or"],
      ["workspace picker", "Prefix w"],
      ["new git worktree", "Prefix Shift+G"],
    ]},
    { title: "Navigate & session", tag: "app", items: [
      ["goto picker, jump to anything", "Prefix g"],
      ["toggle sidebar", "Prefix b"],
      ["open notification target", "Prefix o"],
      ["detach, leave running", "Prefix d"],
      ["reload config", "Prefix q"],
      ["settings", "Prefix s"],
      ["show active keybindings", "Prefix ?"],
    ]},
    { title: "Copy mode", tag: "vi-style", items: [
      ["enter copy mode", "Prefix ["],
      ["begin selection", "v"],
      ["copy selection", "y"],
      ["leave without copying", "q"],
    ]},
  ],
};
</script>
<script src="assets/sheet.js"></script>
</body>
</html>
