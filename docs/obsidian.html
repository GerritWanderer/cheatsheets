<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Obsidian Cheatsheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="assets/sheet.css">
</head>
<body>
<script>
// Source: Obsidian defaults (Linux, Mod = Ctrl) + ~/Documents/notes/.obsidian/hotkeys.json.
window.SHEET = {
  eyebrow: "Notes · vault ~/Documents/notes",
  title: "Obsidian",
  sub: "Linux keys, where Mod is Ctrl (⌘ on macOS). Custom hotkeys come from the notes vault, which also unbinds Ctrl+Shift+F.",
  sections: [
    { title: "Notes & files", tag: "vault", items: [
      ["new note", "Ctrl+n"],
      ["quick switcher", "Ctrl+o"],
      ["command palette", "Ctrl+p"],
      ["close tab", "Ctrl+w"],
      ["reopen closed tab", "Ctrl+Shift+T"],
      ["toggle edit / reading view", "Ctrl+e"],
      ["settings", "Ctrl+,"],
    ]},
    { title: "Daily notes", tag: "custom", items: [
      ["open today's note (custom)", "Ctrl+Shift+D"],
      ["previous daily note (custom)", "Ctrl+Shift+H"],
      ["next daily note (custom)", "Ctrl+Shift+L"],
    ]},
    { title: "Navigate", tag: "panes", items: [
      ["back / forward", "Ctrl+Alt+← Ctrl+Alt+→", "or"],
      ["next / previous tab", "Ctrl+Tab Ctrl+Shift+Tab", "or"],
      ["open link in new tab", "Ctrl+Click"],
      ["graph view", "Ctrl+g"],
      ["toggle left sidebar (custom)", "Ctrl+Shift+B"],
      ["reveal file in explorer (custom)", "Ctrl+Shift+E"],
    ]},
    { title: "Search", tag: "find", items: [
      ["search in current file", "Ctrl+f"],
      ["find and replace", "Ctrl+h"],
      ["search all files (unbound here, run from the palette)", "Search: Search in all files", "cmd"],
    ]},
    { title: "Editing", tag: "format", items: [
      ["bold", "Ctrl+b"],
      ["italic", "Ctrl+i"],
      ["insert link", "Ctrl+k"],
      ["toggle checkbox", "Ctrl+Enter"],
      ["indent / outdent list item", "Tab Shift+Tab", "or"],
      ["undo / redo", "Ctrl+z Ctrl+Shift+Z", "or"],
    ]},
    { title: "Markdown", tag: "syntax", items: [
      ["heading 1–3", "# ## ###", "cmd"],
      ["highlight", "==text==", "cmd"],
      ["strikethrough", "~~text~~", "cmd"],
      ["task", "- [ ] todo", "cmd"],
      ["hidden comment", "%%comment%%", "cmd"],
      ["callout", "> [!note] Title", "cmd"],
    ]},
    { title: "Links & embeds", tag: "graph", items: [
      ["link to a note", "[[Note]]", "cmd"],
      ["link with display text", "[[Note|alias]]", "cmd"],
      ["link to a heading", "[[Note#Heading]]", "cmd"],
      ["link to a block", "[[Note#^block-id]]", "cmd"],
      ["embed a note or section", "![[Note#Heading]]", "cmd"],
      ["tag", "#tag", "cmd"],
    ]},
  ],
};
</script>
<script src="assets/sheet.js"></script>
</body>
</html>
